version = 1

[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  ".github/**",
  "Makefile",
  "openapi/**",
  "pyproject.toml",
  "REUSE.toml",
  "scripts/**",
  "src/**",
  "tests/**",
  "uv.lock",
  "web/**/*.css",
  "web/**/*.html",
  "web/**/*.js",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ANI"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".zenodo.json",
  "PUBLIC_EXPORT_RECEIPT.json",
  "*.cff",
  "*.md",
  "anibench_task_authority/**",
  "codemeta.json",
  "corpus/**",
  "data/**",
  "docs/**",
  "evals/**",
  "examples/**",
  "figures/**",
  "LICENSE-DATA",
  "paper/**",
  "packaging/**",
  "registry/**",
  "release/**",
  "reviews/**",
  "schemas/**",
  "spec/**",
  "tables/**",
  "tasks/**",
  "web/**/*.json",
  "web/**/*.md",
  "web/**/*.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ANI"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["examples/calibration/erp_core/*.md", "examples/calibration/erp_core/*.json", "examples/calibration/erp_core/*.png", "examples/calibration/erp_core/*.pdf"]
precedence = "override"
SPDX-FileCopyrightText = "ERP CORE contributors; 2026 AniBench contributors for analysis modifications"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["examples/calibration/erp_core/*.py"]
precedence = "override"
SPDX-FileCopyrightText = "2026 AniBench contributors"
SPDX-License-Identifier = "Apache-2.0"
